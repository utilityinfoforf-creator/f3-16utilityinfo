<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment History - Utility Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#667eea">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header-section {
      background: white;
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-section h1 {
      font-size: 36px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }

    .header-section p {
      color: #7f8fa3;
      font-size: 15px;
    }

    .back-btn {
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(102, 126, 234, 0.4);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.1);
      text-align: center;
    }

    .stat-card h3 {
      font-size: 13px;
      font-weight: 700;
      color: #7f8fa3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.1);
    }

    .card h3 {
      font-size: 20px;
      color: #2c3e50;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .payment-item {
      padding: 18px;
      border: 1px solid #f0f4ff;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }

    .payment-item:hover {
      background: rgba(102, 126, 234, 0.03);
      border-color: rgba(102, 126, 234, 0.2);
    }

    .payment-info {
      flex: 1;
    }

    .payment-date {
      font-weight: 700;
      color: #2c3e50;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .payment-detail {
      font-size: 13px;
      color: #7f8fa3;
    }

    .payment-amount {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .no-data {
      text-align: center;
      padding: 48px 16px;
      color: #7f8fa3;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header-section">
      <div>
        <h1>📅 Payment History</h1>
        <p>View all your payment transactions</p>
      </div>
      <a href="../main/index.html" class="back-btn">← Back to Dashboard</a>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Paid</h3>
        <div class="value" id="stat-total">Pending</div>
      </div>
      <div class="stat-card">
        <h3>Last Payment</h3>
        <div class="value" id="stat-recent">Pending</div>
      </div>
      <div class="stat-card">
        <h3>Transactions</h3>
        <div class="value" id="stat-count">Pending</div>
      </div>
    </div>

    <!-- PAYMENTS -->
    <div class="card">
      <h3>Recent Payments</h3>
      <div id="paymentList" style="display: flex; flex-direction: column; gap: 12px;">
        <div class="no-data">Loading payment history...</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.APP_SCRIPT_URL || window.API_URL || window.API_BASE || window.__API_URL__ || window.__API_BASE__ || localStorage.getItem('APP_SCRIPT_URL') || 'https://script.google.com/macros/s/AKfycbzUQeJKLBRCjQG928fnIdJ7Tlg-JR0072ENK-K2_07NBOxWsH9zs0qd5CrcoQW_Mbz3lA/exec';
    let customerId = localStorage.getItem("customerId");

    async function loadPaymentHistory() {
      if (!customerId) {
        document.getElementById('paymentList').innerHTML = '<div class="no-data">Please login first</div>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}?id=${encodeURIComponent(customerId)}&action=payment_history`);
        const data = await response.json();

        if (data.payments && data.payments.length > 0) {
          displayPayments(data.payments);
          displayStats(data.payments);
        } else {
          document.getElementById('paymentList').innerHTML = '<div class="no-data">No payment history available yet.</div>';
        }
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('paymentList').innerHTML = '<div class="no-data">Unable to load payment history.</div>';
      }
    }

    function displayPayments(payments) {
      const list = document.getElementById('paymentList');
      list.innerHTML = payments.map(p => `
        <div class="payment-item">
          <div class="payment-info">
            <div class="payment-date">${p.date}</div>
            <div class="payment-detail">Method: ${p.method || 'N/A'} · ID: ${p.id || 'N/A'}</div>
          </div>
          <div class="payment-amount">৳ ${parseFloat(p.amount || 0).toFixed(2)}</div>
        </div>
      `).join('');
    }

    function displayStats(payments) {
      const total = payments.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
      const recent = parseFloat(payments[0]?.amount || 0);

      document.getElementById('stat-total').textContent = `৳ ${total.toFixed(2)}`;
      document.getElementById('stat-recent').textContent = `৳ ${recent.toFixed(2)}`;
      document.getElementById('stat-count').textContent = payments.length;
    }

    loadPaymentHistory();
  </script>
</body>
</html>
