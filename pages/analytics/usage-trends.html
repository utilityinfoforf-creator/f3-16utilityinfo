<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Usage Trends - Utility Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#667eea">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header-section {
      background: white;
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-section h1 {
      font-size: 36px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }

    .header-section p {
      color: #7f8fa3;
      font-size: 15px;
    }

    .back-btn {
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(102, 126, 234, 0.4);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.1);
      text-align: center;
    }

    .stat-card h3 {
      font-size: 13px;
      font-weight: 700;
      color: #7f8fa3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.1);
      margin-bottom: 24px;
    }

    .card h3 {
      font-size: 20px;
      color: #2c3e50;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .chart-container { position: relative; height: 300px; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
    }

    th {
      padding: 16px 12px;
      text-align: left;
      font-weight: 700;
      color: #667eea;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
    }

    td {
      padding: 14px 12px;
      color: #2c3e50;
      border-bottom: 1px solid #f0f4ff;
      font-size: 14px;
    }

    tbody tr:hover {
      background: rgba(102, 126, 234, 0.03);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .no-data {
      text-align: center;
      padding: 48px 16px;
      color: #7f8fa3;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header-section">
      <div>
        <h1>📈 Usage Trends</h1>
        <p>Analyze your consumption patterns over time</p>
      </div>
      <a href="../main/index.html" class="back-btn">← Back to Dashboard</a>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Current Month</h3>
        <div class="value" id="stat-current">Pending</div>
      </div>
      <div class="stat-card">
        <h3>Average</h3>
        <div class="value" id="stat-average">Pending</div>
      </div>
      <div class="stat-card">
        <h3>Peak Usage</h3>
        <div class="value" id="stat-peak">Pending</div>
      </div>
      <div class="stat-card">
        <h3>Lowest Usage</h3>
        <div class="value" id="stat-low">Pending</div>
      </div>
    </div>

    <!-- CHART -->
    <div class="card">
      <h3>Monthly Consumption</h3>
      <div class="chart-container">
        <canvas id="usageChart"></canvas>
      </div>
    </div>

    <!-- TABLE -->
    <div class="card">
      <h3>Monthly Details</h3>
      <div style="overflow-x: auto;">
        <table id="usageTable">
          <thead>
            <tr>
              <th>Month</th>
              <th>Consumption (units)</th>
              <th>Bill Amount</th>
              <th>Per Unit</th>
            </tr>
          </thead>
          <tbody id="usageBody">
            <tr><td colspan="4" class="no-data">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let chart;
    const customerId = localStorage.getItem("customerId");

    async function loadUsageTrends() {
      if (!customerId) {
        document.getElementById('usageBody').innerHTML = '<tr><td colspan="4" class="no-data">Customer ID not found.</td></tr>';
        return;
      }

      try {
        const scriptUrl = window.APP_SCRIPT_URL || window.API_URL || window.API_BASE || window.__API_URL__ || window.__API_BASE__ || localStorage.getItem('APP_SCRIPT_URL') || 'https://script.google.com/macros/s/AKfycbzUQeJKLBRCjQG928fnIdJ7Tlg-JR0072ENK-K2_07NBOxWsH9zs0qd5CrcoQW_Mbz3lA/exec';
        if (!scriptUrl) {
          document.getElementById('usageBody').innerHTML = '<tr><td colspan="4" class="no-data">Apps Script URL not configured.</td></tr>';
          return;
        }
        const res = await fetch(`${scriptUrl}?id=${encodeURIComponent(customerId)}&action=getUsageTrends`, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && data.error) throw new Error(data.error);

        const rows = Array.isArray(data && data.data) ? data.data : [];
        if (!rows.length) {
          document.getElementById('usageBody').innerHTML = '<tr><td colspan="4" class="no-data">No usage data available.</td></tr>';
          return;
        }

        displayChart(rows);
        displayTable(rows);
        displayStats(rows);
      } catch (err) {
        document.getElementById('usageBody').innerHTML = `<tr><td colspan="4" class="no-data">Error loading data: ${err.message}</td></tr>`;
      }
    }

    function displayChart(data) {
      if (chart) chart.destroy();
      const ctx = document.getElementById('usageChart').getContext('2d');
      const usageValues = data.map(d => (parseFloat(d.electric || 0) + parseFloat(d.water || 0) + parseFloat(d.gas || 0)).toFixed(2));
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.map(d => d.month),
          datasets: [{
            label: 'Total Usage',
            data: usageValues,
            borderColor: '#764ba2',
            backgroundColor: 'rgba(118, 75, 162, 0.05)',
            borderWidth: 3,
            fill: true,
            tension: 0.4,
            pointRadius: 5,
            pointBackgroundColor: '#764ba2',
            pointBorderColor: '#fff',
            pointBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { color: '#7f8fa3' }, grid: { color: 'rgba(102, 126, 234, 0.05)' } }, x: { ticks: { color: '#7f8fa3' }, grid: { display: false } } }
        }
      });
    }

    function displayTable(data) {
      const tbody = document.getElementById('usageBody');
      tbody.innerHTML = data.map(d => {
        const totalUsage = parseFloat(d.electric || 0) + parseFloat(d.water || 0) + parseFloat(d.gas || 0);
        return `
          <tr>
            <td style="font-weight: 700; color: #667eea;">${d.month}</td>
            <td style="font-weight: 600;">${totalUsage.toFixed(2)} units</td>
            <td style="color: #667eea; font-weight: 700;">৳ ${totalUsage.toFixed(2)}</td>
            <td style="font-size: 13px; color: #7f8fa3;">E: ${parseFloat(d.electric || 0).toFixed(2)} · W: ${parseFloat(d.water || 0).toFixed(2)} · G: ${parseFloat(d.gas || 0).toFixed(2)}</td>
          </tr>
        `;
      }).join('');
    }

    function displayStats(data) {
      const usages = data.map(d => parseFloat(d.electric || 0) + parseFloat(d.water || 0) + parseFloat(d.gas || 0));
      const current = usages[usages.length - 1] || 0;
      const average = (usages.reduce((a, b) => a + b, 0) / (usages.length || 1)).toFixed(2);
      const peak = Math.max(...usages);
      const low = Math.min(...usages);

      document.getElementById('stat-current').textContent = `${current.toFixed(2)} units`;
      document.getElementById('stat-average').textContent = `${average} units`;
      document.getElementById('stat-peak').textContent = `${peak.toFixed(2)} units`;
      document.getElementById('stat-low').textContent = `${low.toFixed(2)} units`;
    }

    loadUsageTrends();
  </script>
</body>
</html>
