<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing History - Utility Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#667eea">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header-section {
      background: white;
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-section h1 {
      font-size: 36px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }

    .header-section p {
      color: #7f8fa3;
      font-size: 15px;
    }

    .back-btn {
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(102, 126, 234, 0.4);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.1);
      text-align: center;
    }

    .stat-card h3 {
      font-size: 13px;
      font-weight: 700;
      color: #7f8fa3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.1);
    }

    .card h3 {
      font-size: 20px;
      color: #2c3e50;
      margin-bottom: 24px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .export-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s;
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.25);
    }

    .export-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
    }

    th {
      padding: 16px 12px;
      text-align: left;
      font-weight: 700;
      color: #667eea;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
    }

    td {
      padding: 14px 12px;
      color: #2c3e50;
      border-bottom: 1px solid #f0f4ff;
      font-size: 14px;
    }

    tbody tr:hover {
      background: rgba(102, 126, 234, 0.03);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .balance-highlight {
      font-weight: 700;
      color: #667eea;
    }

    .no-data {
      text-align: center;
      padding: 48px 16px;
      color: #7f8fa3;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header-section">
      <div>
        <h1>📊 Billing History</h1>
        <p>View your complete balance update history</p>
      </div>
      <a href="../main/index.html" class="back-btn">← Back to Dashboard</a>
    </div>

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <h3>Latest Balance</h3>
        <div class="value" id="stat-latest">Pending</div>
      </div>
      <div class="stat-card">
        <h3>Highest Balance</h3>
        <div class="value" id="stat-highest">Pending</div>
      </div>
      <div class="stat-card">
        <h3>Lowest Balance</h3>
        <div class="value" id="stat-lowest">Pending</div>
      </div>
      <div class="stat-card">
        <h3>Average Balance</h3>
        <div class="value" id="stat-average">Pending</div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="card">
      <h3>
        Balance Updates
        <button class="export-btn" onclick="exportToCSV()">📥 Export CSV</button>
      </h3>
      <div style="overflow-x: auto;">
        <table id="billingTable">
          <thead>
            <tr>
              <th>Date & Time</th>
              <th>Electric Balance</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody id="billingBody">
            <tr><td colspan="3" class="no-data">Loading billing history...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.APP_SCRIPT_URL || window.API_URL || window.API_BASE || window.__API_URL__ || window.__API_BASE__ || localStorage.getItem('APP_SCRIPT_URL') || 'https://script.google.com/macros/s/AKfycbzUQeJKLBRCjQG928fnIdJ7Tlg-JR0072ENK-K2_07NBOxWsH9zs0qd5CrcoQW_Mbz3lA/exec';
    let customerId = localStorage.getItem("customerId");
    let billingData = [];

    async function loadBillingHistory() {
      if (!customerId) {
        document.getElementById('billingBody').innerHTML = '<tr><td colspan="3" class="no-data">Please login first</td></tr>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}?id=${encodeURIComponent(customerId)}&history=true`);
        const data = await response.json();

        if (data.history && data.history.length > 0) {
          billingData = data.history;
          displayBillingHistory(data.history);
          displayStats(data.history);
        } else {
          document.getElementById('billingBody').innerHTML = '<tr><td colspan="3" class="no-data">No billing history available</td></tr>';
        }
      } catch (error) {
        console.error('Error loading billing history:', error);
        document.getElementById('billingBody').innerHTML = '<tr><td colspan="3" class="no-data">Error loading data. Please try again.</td></tr>';
      }
    }

    function displayBillingHistory(history) {
      const tbody = document.getElementById('billingBody');
      tbody.innerHTML = history.map(item => `
        <tr>
          <td>${item.date}</td>
          <td class="balance-highlight">৳ ${parseFloat(item.balance).toFixed(2)}</td>
          <td>${item.description}</td>
        </tr>
      `).join('');
    }

    function displayStats(history) {
      const balances = history.map(h => parseFloat(h.balance));
      const latest = balances[0];
      const highest = Math.max(...balances);
      const lowest = Math.min(...balances);
      const average = (balances.reduce((a, b) => a + b, 0) / balances.length).toFixed(2);

      document.getElementById('stat-latest').textContent = `৳ ${latest.toFixed(2)}`;
      document.getElementById('stat-highest').textContent = `৳ ${highest.toFixed(2)}`;
      document.getElementById('stat-lowest').textContent = `৳ ${lowest.toFixed(2)}`;
      document.getElementById('stat-average').textContent = `৳ ${average}`;
    }

    function exportToCSV() {
      if (!billingData || billingData.length === 0) {
        alert('No data to export');
        return;
      }

      let csv = 'Date & Time,Electric Balance,Description\n';
      billingData.forEach(item => {
        csv += `"${item.date}","${item.balance}","${item.description}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `billing-history-${customerId}-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }

    loadBillingHistory();
  </script>
</body>
</html>
