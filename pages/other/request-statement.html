<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Statement</title>
  <style>
    :root {
      --bg: #f4f2ee;
      --panel: #ffffff;
      --card-border: #e7ddcf;
      --primary: #5b3c1a;
      --primary-strong: #3f2914;
      --accent: #c88b4f;
      --text: #2d241d;
      --muted: #6a584d;
      --success: #1e7c46;
      --success-bg: #ebf8f0;
      --error: #b42318;
      --error-bg: #fdf1f1;
      --shadow: 0 12px 30px rgba(58, 40, 25, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f9f5f1 0%, var(--bg) 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 660px);
      background: var(--panel);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px 24px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.9rem, 2vw, 2.4rem);
      color: var(--primary-strong);
    }

    #meta {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    #meta p {
      margin: 0;
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      color: var(--primary-strong);
    }

    .field-hint {
      display: block;
      margin-bottom: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
    }

    input[type="date"], textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d5c5b5;
      border-radius: 10px;
      background: #fffdfb;
      font-size: 1rem;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="date"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(200, 139, 79, 0.14);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    .btn {
      margin-top: 6px;
      padding: 14px 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 18px rgba(91, 60, 26, 0.18);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .result {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 600;
      line-height: 1.5;
      display: none;
    }

    .notice {
      display: block;
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid rgba(30, 124, 70, 0.18);
    }

    .error {
      display: block;
      color: var(--error);
      background: var(--error-bg);
      border: 1px solid rgba(180, 35, 24, 0.16);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Billing</div>
    <h1>Request Statement</h1>
    <div id="meta"></div>
    <form id="stmtForm">
      <label>
        <span class="field-hint">From date</span>
        <input type="date" id="fromDate" required />
      </label>
      <label>
        <span class="field-hint">To date</span>
        <input type="date" id="toDate" required />
      </label>
      <label>
        <span class="field-hint">Message (optional)</span>
        <textarea id="message" rows="4" placeholder="Add any extra details or notes for the billing team"></textarea>
      </label>
      <button type="submit" class="btn">Request Statement</button>
    </form>
    <div id="result" class="result"></div>
  </div>

  <script>
    function getQueryParams() {
      const params = {};
      location.search.replace(/^\?/, '').split('&').forEach(function (p) {
        if (!p) return;
        var parts = p.split('=');
        params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
      });
      return params;
    }

    const params = getQueryParams();
    const meta = document.getElementById('meta');
    const storedCustomer = localStorage.getItem('customerId') || params.customerId || '';
    const storedEmail = localStorage.getItem('emailAddress') || '';

    if (storedCustomer) {
      meta.innerHTML = `<p>Requesting for customer: <strong>${storedCustomer}</strong>${storedEmail ? ' &lt;' + storedEmail + '&gt;' : ''}</p>`;
    } else {
      meta.innerHTML = `<p><em>No customer selected. You must be logged in to request a statement.</em></p>`;
    }

    document.getElementById('stmtForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      const resultEl = document.getElementById('result');
      resultEl.className = 'result';
      resultEl.textContent = '';

      if (!storedCustomer) {
        resultEl.className = 'result error';
        resultEl.textContent = 'You must be logged in to request a statement.';
        return;
      }

      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;
      const message = document.getElementById('message').value || '';

      if (!fromDate || !toDate) {
        resultEl.className = 'result error';
        resultEl.textContent = 'Please provide both From and To dates.';
        return;
      }

      if (fromDate > toDate) {
        resultEl.className = 'result error';
        resultEl.textContent = 'From date must be before or equal to To date.';
        return;
      }

      // Optional: enforce max span of 12 months
      const from = new Date(fromDate + 'T00:00:00');
      const to = new Date(toDate + 'T23:59:59');
      const monthsSpan = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
      if (monthsSpan > 12) {
        resultEl.className = 'result error';
        resultEl.textContent = 'Maximum allowed range is 12 months. Please narrow the range.';
        return;
      }

      // Build payload expected by Apps Script
      const payload = {
        action: 'requestStatement',
        customerId: storedCustomer,
        email: storedEmail,
        fromDate: fromDate,
        toDate: toDate,
        message: message
      };

      // Use the same deployed Apps Script endpoint used by the other pages in this app.
      const endpoint = window.API_URL || window.API_BASE || window.__API_URL__ || window.__API_BASE__ ||
        'https://script.google.com/macros/s/AKfycbzUQeJKLBRCjQG928fnIdJ7Tlg-JR0072ENK-K2_07NBOxWsH9zs0qd5CrcoQW_Mbz3lA/exec';
      const postUrl = endpoint;

      resultEl.textContent = 'Submitting request...';

      fetch(postUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        mode: 'cors',
        credentials: 'omit'
      }).then(function (resp) {
        return resp.text().then(function (text) {
          if (!resp.ok) {
            var details = text ? text.trim() : '';
            var reason = details || 'HTTP ' + resp.status;
            throw new Error(reason);
          }
          if (!text) {
            throw new Error('Empty response from Apps Script. The deployment URL may be invalid or not published.');
          }
          try {
            return JSON.parse(text);
          } catch (err) {
            throw new Error('Apps Script returned a non-JSON response. The deployment URL may be invalid, expired, or unpublished.');
          }
        });
      }).then(function (json) {
        if (json && json.success) {
          resultEl.className = 'result notice';
          resultEl.textContent = 'Statement request submitted. We have logged your request and will email you when it is ready.';
        } else {
          resultEl.className = 'result error';
          resultEl.textContent = 'Failed to submit request: ' + (json && json.error ? json.error : JSON.stringify(json));
        }
      }).catch(function (err) {
        var message = err && err.message ? err.message : String(err);
        var deploymentHint = 'The Apps Script web app URL in this page is invalid, expired, or not published yet. Open Apps Script > Deploy > Web App and update the deployment URL.';
        resultEl.className = 'result error';
        resultEl.textContent = 'Request failed: ' + message + '. ' + deploymentHint;
      });
    });
  </script>
</body>
</html>
