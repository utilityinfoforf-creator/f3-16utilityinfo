<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Statement</title>
  <style>
    :root {
      --bg: #f8faff;
      --panel: #ffffff;
      --card-border: #e0e8ff;
      --primary: #667eea;
      --primary-strong: #5568d3;
      --accent: #764ba2;
      --text: #2c3e50;
      --muted: #7f8fa3;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --error: #ef4444;
      --error-bg: #fef2f2;
      --shadow: 0 12px 30px rgba(102, 126, 234, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 660px);
      background: var(--panel);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 40px 32px;
      backdrop-filter: blur(10px);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 3vw, 2.6rem);
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }

    #meta {
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    #meta p {
      margin: 0;
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      color: var(--primary-strong);
    }

    .field-hint {
      display: block;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="date"], textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      background: #f8faff;
      font-size: 1rem;
      color: var(--text);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="date"]:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    .btn {
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 12px 28px rgba(102, 126, 234, 0.28);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }

    .btn:active::before {
      width: 250px;
      height: 250px;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .result {
      margin-top: 24px;
      padding: 16px 18px;
      border-radius: 12px;
      font-weight: 600;
      line-height: 1.6;
      display: none;
      border-left: 4px solid;
    }

    .notice {
      display: block;
      color: var(--success);
      background: var(--success-bg);
      border-left-color: var(--success);
    }

    .error {
      display: block;
      color: var(--error);
      background: var(--error-bg);
      border-left-color: var(--error);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Billing</div>
    <h1>Request Statement</h1>
    <div id="meta"></div>
    <form id="stmtForm">
      <label>
        <span class="field-hint">From date</span>
        <input type="date" id="fromDate" required />
      </label>
      <label>
        <span class="field-hint">To date</span>
        <input type="date" id="toDate" required />
      </label>
      <label>
        <span class="field-hint">Message (optional)</span>
        <textarea id="message" rows="4" placeholder="Add any extra details or notes for the billing team"></textarea>
      </label>
      <button type="submit" class="btn">Request Statement</button>
    </form>
    <div id="result" class="result"></div>
  </div>

  <script>
    function getQueryParams() {
      const params = {};
      location.search.replace(/^\?/, '').split('&').forEach(function (p) {
        if (!p) return;
        var parts = p.split('=');
        params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
      });
      return params;
    }

    const params = getQueryParams();
    const meta = document.getElementById('meta');
    const storedCustomer = localStorage.getItem('customerId') || params.customerId || '';
    const storedEmail = localStorage.getItem('emailAddress') || '';

    if (storedCustomer) {
      meta.innerHTML = `<p>Requesting for customer: <strong>${storedCustomer}</strong>${storedEmail ? ' &lt;' + storedEmail + '&gt;' : ''}</p>`;
    } else {
      meta.innerHTML = `<p><em>No customer selected. You must be logged in to request a statement.</em></p>`;
    }

    document.getElementById('stmtForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      const resultEl = document.getElementById('result');
      resultEl.className = 'result';
      resultEl.textContent = '';

      if (!storedCustomer) {
        resultEl.className = 'result error';
        resultEl.textContent = 'You must be logged in to request a statement.';
        return;
      }

      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;
      const message = document.getElementById('message').value || '';

      if (!fromDate || !toDate) {
        resultEl.className = 'result error';
        resultEl.textContent = 'Please provide both From and To dates.';
        return;
      }

      if (fromDate > toDate) {
        resultEl.className = 'result error';
        resultEl.textContent = 'From date must be before or equal to To date.';
        return;
      }

      // Optional: enforce max span of 12 months
      const from = new Date(fromDate + 'T00:00:00');
      const to = new Date(toDate + 'T23:59:59');
      const monthsSpan = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
      if (monthsSpan > 12) {
        resultEl.className = 'result error';
        resultEl.textContent = 'Maximum allowed range is 12 months. Please narrow the range.';
        return;
      }

      // Build payload expected by Apps Script
      const payload = {
        action: 'requestStatement',
        customerId: storedCustomer,
        email: storedEmail,
        fromDate: fromDate,
        toDate: toDate,
        message: message
      };

      // Use the Apps Script endpoint configured at runtime.
      const endpoint = window.APP_SCRIPT_URL || window.API_URL || window.API_BASE || window.__API_URL__ || window.__API_BASE__ || localStorage.getItem('APP_SCRIPT_URL') || 'https://script.google.com/macros/s/AKfycbzUQeJKLBRCjQG928fnIdJ7Tlg-JR0072ENK-K2_07NBOxWsH9zs0qd5CrcoQW_Mbz3lA/exec';
      if (!endpoint) {
        resultEl.className = 'result error';
        resultEl.textContent = 'Apps Script web app URL is not configured. Publish the web app and set APP_SCRIPT_URL or localStorage.APP_SCRIPT_URL.';
        return;
      }
      const postUrl = endpoint;

      resultEl.textContent = 'Submitting request...';

      fetch(postUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        mode: 'cors',
        credentials: 'omit'
      }).then(function (resp) {
        return resp.text().then(function (text) {
          if (!resp.ok) {
            var details = text ? text.trim() : '';
            var reason = details || 'HTTP ' + resp.status;
            throw new Error(reason);
          }
          if (!text) {
            throw new Error('Empty response from Apps Script. The deployment URL may be invalid or not published.');
          }
          try {
            return JSON.parse(text);
          } catch (err) {
            throw new Error('Apps Script returned a non-JSON response. The deployment URL may be invalid, expired, or unpublished.');
          }
        });
      }).then(function (json) {
        if (json && json.success) {
          resultEl.className = 'result notice';
          resultEl.textContent = 'Statement request submitted. We have logged your request and will email you when it is ready.';
        } else {
          resultEl.className = 'result error';
          resultEl.textContent = 'Failed to submit request: ' + (json && json.error ? json.error : JSON.stringify(json));
        }
      }).catch(function (err) {
        var message = err && err.message ? err.message : String(err);
        var deploymentHint = 'The Apps Script web app URL in this page is invalid, expired, or not published yet. Open Apps Script > Deploy > Web App and update the deployment URL.';
        resultEl.className = 'result error';
        resultEl.textContent = 'Request failed: ' + message + '. ' + deploymentHint;
      });
    });
  </script>
</body>
</html>
